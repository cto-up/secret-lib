type: object
required:
    - id
    - name
    - connector_type
    - status
    - created_at
    - updated_at
properties:
    id:
        type: string
        format: uuid
    name:
        type: string
        description: Human-readable name for this secret, unique per tenant
    connector_type:
        type: string
        description: Type of connector this secret belongs to (e.g. smtp, slack, stripe)
    description:
        type: string
        nullable: true
        description: Optional human-readable note about this secret
    status:
        $ref: "../secret-schema.yaml#/components/schemas/SecretStatus"
    tenant_id:
        type: string
        nullable: true
    created_by:
        type: string
        nullable: true
    created_at:
        type: string
        format: date-time
    updated_at:
        type: string
        format: date-time
