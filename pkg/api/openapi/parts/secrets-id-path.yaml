delete:
    description: Hard-delete a secret (any status). Requires ADMIN or above.
    operationId: deleteSecret
    parameters:
        - name: id
          in: path
          description: Secret ID
          required: true
          schema:
              type: string
              format: uuid
    responses:
        "204":
            description: Deleted
        "401":
            description: Unauthorized
        "403":
            description: Forbidden
        "404":
            description: Not found
        "500":
            description: Internal server error
