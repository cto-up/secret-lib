post:
    description: Revoke a secret so it can no longer be used by connectors. Requires ADMIN or above.
    operationId: revokeSecret
    parameters:
        - name: id
          in: path
          description: Secret ID
          required: true
          schema:
              type: string
              format: uuid
    responses:
        "200":
            description: Secret revoked
            content:
                application/json:
                    schema:
                        $ref: "../secret-schema.yaml#/components/schemas/Secret"
        "401":
            description: Unauthorized
        "403":
            description: Forbidden
        "404":
            description: Not found
        "500":
            description: Internal server error
