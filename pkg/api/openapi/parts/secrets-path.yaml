get:
    description: List secrets. SUPER_ADMIN sees all tenants; ADMIN sees only their own tenant. Supports filtering by status and connector_type.
    operationId: listSecrets
    parameters:
        - name: status
          in: query
          description: Filter by status (active, revoked)
          required: false
          schema:
              $ref: "../secret-schema.yaml#/components/schemas/SecretStatus"
        - name: connector_type
          in: query
          description: Filter by connector type
          required: false
          schema:
              type: string
        - name: tenant_id
          in: query
          description: Filter by tenant ID (SUPER_ADMIN only)
          required: false
          schema:
              type: string
        - name: page
          in: query
          required: false
          schema:
              type: integer
              default: 1
        - name: page_size
          in: query
          required: false
          schema:
              type: integer
              default: 50
    responses:
        "200":
            description: List of secrets
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            $ref: "../secret-schema.yaml#/components/schemas/Secret"
        "401":
            description: Unauthorized
        "403":
            description: Forbidden
        "500":
            description: Internal server error
post:
    description: |
        Create a tenant-scoped secret. The plaintext value is
        encrypted (AES-256-GCM) before persistence and never echoed
        back. Requires ADMIN / CUSTOMER_ADMIN / SUPER_ADMIN.
    operationId: createSecret
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../secret-schema.yaml#/components/schemas/CreateSecretRequest"
    responses:
        "201":
            description: Secret created
            content:
                application/json:
                    schema:
                        $ref: "../secret-schema.yaml#/components/schemas/Secret"
        "400":
            description: Invalid request
        "401":
            description: Unauthorized
        "403":
            description: Forbidden
        "409":
            description: A secret with this name already exists for the tenant
        "500":
            description: Internal server error
