openapi: "3.0.0"
info:
    version: 1.0.0
    title: Secret Management API
    description: Schema types for the secret module

components:
    schemas:
        SecretStatus:
            type: string
            enum: [active, revoked]
            description: Status of a secret
        Secret:
            $ref: "./parts/secret-schema.yaml"
        CreateSecretRequest:
            type: object
            required: [name, value, connector_type]
            description: |
                Payload for POST /admin-api/v1/secret/secrets. `value`
                is stored encrypted (AES-256-GCM); it is never echoed
                back by any endpoint.
            properties:
                name:
                    type: string
                    description: Unique name within the tenant
                value:
                    type: string
                    description: Plaintext; encrypted at rest
                connector_type:
                    type: string
                    description: Consumer hint (lre_api, smtp, openai…)
                description:
                    type: string
                    nullable: true

        GenerateSecretRequest:
            type: object
            required: [name, connector_type]
            description: |
                Payload for POST /admin-api/v1/secret/secrets/generate.
                Server mints a strong random value (crypto/rand → hex)
                and stores it encrypted. The plaintext is returned in the
                response exactly once — never persisted in plaintext nor
                retrievable later.
            properties:
                name:
                    type: string
                    description: Unique name within the tenant
                connector_type:
                    type: string
                    description: Consumer hint (lre_api, smtp, openai, webhook-hmac…)
                description:
                    type: string
                    nullable: true
                length_bytes:
                    type: integer
                    minimum: 16
                    maximum: 128
                    default: 32
                    description: Number of random bytes to mint before hex-encoding (default 32 → 64 hex chars). Capped at 128.

        GeneratedSecret:
            type: object
            required: [secret, value]
            description: |
                One-time response from POST /admin-api/v1/secret/secrets/generate.
                `value` is the plaintext that the caller must capture now — it is
                never retrievable from any other endpoint.
            properties:
                secret:
                    $ref: "./parts/secret-schema.yaml"
                value:
                    type: string
                    description: Plaintext value of the newly-minted secret. Shown once.
