openapi: "3.0.0"
info:
    version: 1.0.0
    title: Secret Management API
    description: Schema types for the secret module

components:
    schemas:
        SecretStatus:
            type: string
            enum: [active, revoked]
            description: Status of a secret
        Secret:
            $ref: "./parts/secret-schema.yaml"
        CreateSecretRequest:
            type: object
            required: [name, value, connector_type]
            description: |
                Payload for POST /admin-api/v1/secret/secrets. `value`
                is stored encrypted (AES-256-GCM); it is never echoed
                back by any endpoint.
            properties:
                name:
                    type: string
                    description: Unique name within the tenant
                value:
                    type: string
                    description: Plaintext; encrypted at rest
                connector_type:
                    type: string
                    description: Consumer hint (lre_api, smtp, openai…)
                description:
                    type: string
                    nullable: true
